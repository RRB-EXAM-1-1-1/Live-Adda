# Live Adda - Nginx reverse proxy config
# Serves the React build as static files and proxies /api to the FastAPI backend.
# Replace server_name with YOUR_DROPLET_IP or your DuckDNS hostname.

server {
    listen 80;
    server_name YOUR_DROPLET_IP;   # e.g. 203.0.113.10  or  liveadda.duckdns.org

    # Allow large video uploads (up to ~2GB per the plan limit)
    client_max_body_size 2200M;

    # Increase timeouts for large uploads / long requests
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # --- API -> FastAPI backend (port 8001) ---
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- Frontend static build ---
    root /opt/live-adda/frontend/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA fallback for React Router
    }

    # Cache static assets
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
