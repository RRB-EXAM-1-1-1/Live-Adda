; Live Adda - Supervisor config for the FastAPI backend
; Copy to /etc/supervisor/conf.d/live-adda-backend.conf
; Runs uvicorn on 127.0.0.1:8001 (Nginx proxies /api to it).

[program:live-adda-backend]
command=/opt/live-adda/backend/venv/bin/uvicorn server:app --host 0.0.0.0 --port 8001 --workers 2
directory=/opt/live-adda/backend
autostart=true
autorestart=true
startretries=3
stopwaitsecs=15
stderr_logfile=/var/log/live-adda/backend.err.log
stdout_logfile=/var/log/live-adda/backend.out.log
environment=PATH="/opt/live-adda/backend/venv/bin:%(ENV_PATH)s"

; Create the log directory once:  mkdir -p /var/log/live-adda
