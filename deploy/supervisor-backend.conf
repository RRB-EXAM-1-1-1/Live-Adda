; Live Adda - Supervisor config for the FastAPI backend
; Copy to /etc/supervisor/conf.d/live-adda-backend.conf
; Runs uvicorn on 127.0.0.1:8001 (Nginx proxies /api to it).
;
; IMPORTANT: `--workers 1` is intentional. This app runs long-lived asyncio
; background tasks (ffmpeg reaper, plan-expiry sweeper) and an in-process
; concurrency semaphore for transcodes. Running >1 worker would duplicate
; those loops and split the semaphore, causing race conditions on ffmpeg
; termination and violating the "1 transcode at a time" guarantee.

[program:live-adda-backend]
command=/opt/live-adda/backend/venv/bin/uvicorn server:app --host 0.0.0.0 --port 8001 --workers 1
directory=/opt/live-adda/backend
autostart=true
autorestart=true
startretries=5
startsecs=5
stopwaitsecs=20
stopsignal=TERM
stderr_logfile=/var/log/live-adda/backend.err.log
stdout_logfile=/var/log/live-adda/backend.out.log
stderr_logfile_maxbytes=25MB
stderr_logfile_backups=5
stdout_logfile_maxbytes=25MB
stdout_logfile_backups=5
environment=PATH="/opt/live-adda/backend/venv/bin:%(ENV_PATH)s"

; Create the log directory once:  mkdir -p /var/log/live-adda
